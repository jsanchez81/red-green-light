name: CI - Quality Gates

on:
  pull_request:
    branches:
      - main
      - develop

# Cancela ejecuciones obsoletas si se hace un nuevo push en el mismo PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Lint, Tests & Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 3. Install dependencies (Clean Install)
        run: npm ci

      - name: 4. Static code analysis (ESLint)
        run: npm run lint

      - name: 5. Unit tests execution (Jest)
        run: npm test -- --ci

      - name: 6. Production build verification (Angular)
        run: npm run build
