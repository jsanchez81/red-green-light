<section class="c-game-play" aria-label="Tablero de juego">
  <!-- High Score Centrado -->
  <div class="c-game-play__high-score" role="status" aria-live="polite">
    <span class="c-game-play__high-score-label">High score:</span>
    <span class="c-game-play__high-score-value">{{ highScore() }}</span>
  </div>

  <!-- Semáforo -->
  <div class="c-game-play__traffic-light">
    <app-traffic-light [color]="lightColor()" />
  </div>

  <!-- Score Actual -->
  <h2 class="c-game-play__score" role="status" aria-live="polite">
    Score: <span class="c-game-play__score-value">{{ currentScore() }}</span>
  </h2>

  <!-- Botones de Acción: Izquierda y Derecha con icono de huella -->
  <div class="c-game-play__controls">
    <app-ui-button
      icon="paw"
      label="Izquierda"
      variant="primary"
      (btnClick)="onLeftClick()"
    />

    <app-ui-button
      icon="paw"
      label="Derecha"
      variant="primary"
      (btnClick)="onRightClick()"
    />
  </div>
</section>
