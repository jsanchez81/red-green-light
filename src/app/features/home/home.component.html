<main id="main-content" class="o-page" role="main">
  <div class="o-container">
    <section class="c-home-card o-stack o-stack--center" aria-labelledby="home-title">
      <header class="c-home-card__header o-stack o-stack--tight">
        <h1 id="home-title" class="c-home-card__title">
          Red &amp; Green
        </h1>
      </header>

      <div class="c-home-card__icon-container">
        <app-split-circle-icon
          [size]="130"
          accessibleTitle="Icono Red and Green"
          accessibleDescription="Círculo dividido verticalmente en dos colores: verde a la izquierda y rojo a la derecha"
        />
      </div>

      <div class="c-home-card__form-wrapper">
        <app-player-form (playerSubmit)="handlePlayerSubmit($event)" />
      </div>
    </section>
  </div>
</main>
